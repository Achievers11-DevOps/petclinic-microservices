name: Obunha Branch CI

on:
  push:
    branches:
      - 'features/GPM-*'
  pull_request:
    branches:
      - dev

jobs:
    validate:
        name: Validate Documenetation and Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                java-version: '17'
                destination: temurin
                cache: maven

            - name: Build with Maven
              run: ./maven clean package -DskipTests

            - name: Verify docs structure
              run: |
                echo "Checking documentation structure..."
                find docs/ -type f -name '*.md' | sort 2>/dev/null || echo 'docs will be created'
                echo 'Total docs files: '$(find docs/ -name '*.md' 2>/dev/null | wc -l)
                echo 'Branch: ${{ github.ref_name }}'

            - name: Build Summary
              run: |
                echo '### Obunha Branch CI' >> $GITHUB_STEP_SUMMARY
                    echo '- Branch: ${{ github.ref_name }}' >> $GITHUB_STEP_SUMMARY
                  echo '- Maven Build: Passed' >> $GITHUB_STEP_SUMMARY
                  echo '- Documentation Count: '$(find docs/ -name '*.md' 2>/dev/null | wc -l) >> $GITHUB_STEP_SUMMARY
                  echo '- Target: dev branch' >> $GITHUB_STEP_SUMMARY
