name: Sandra Branch CI

on:
  push:
    branches:
      - 'feature/GPM-*'
  pull_request:
    branches:
      - dev

jobs:
  validate:
    name: Validate Docs and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Verify tool versions
        run: |
          echo '=== Java ===' && java --version
          echo '=== Maven ===' && ./mvnw --version
          echo '=== Git ===' && git --version

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Verify docs structure
        run: |
          echo 'Checking docs folders'
          ls docs/ || echo 'docs folder will be created'
          echo 'Branch: ${{ github.ref_name }}'

      - name: Build summary
        run: |
          echo '### Sandra Branch CI' >> $GITHUB_STEP_SUMMARY
          echo '- Branch: ${{ github.ref_name }}' >> $GITHUB_STEP_SUMMARY
          echo '- Build: PASSED' >> $GITHUB_STEP_SUMMARY
          echo '- Target: dev branch' >> $GITHUB_STEP_SUMMARY
